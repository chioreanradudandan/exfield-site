<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
  <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <title>Exfield – Habit Calendar</title>
  <meta name="description" content="Don't break the chain. A wall-calendar habit tracker for iOS and Android: one red X per day, your chain and record, the whole year at a glance — all data on your device.">
  <style>
    :root {
      --paper: #FAF6EF;
      --ink: #2B2A27;
      --ink-faded: #9B968C;
      --marker: #CC2F26;
      --grid: #D9D2C4;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --paper: #201D18;
        --ink: #EAE4D8;
        --ink-faded: #8F887A;
        --marker: #E0473C;
        --grid: #3C372E;
      }
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: var(--paper);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 12vh 24px 40px;
    }
    main { max-width: 26rem; text-align: center; }
    .screens {
      margin-top: 56px;
      width: 100%;
      max-width: 62rem;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(200px, 100%), 1fr));
      gap: 28px 24px;
      justify-items: center;
    }
    .screens figure { width: 100%; min-width: 0; max-width: 300px; text-align: center; }
    .screens img {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 9.5%/4.4%;
      border: 1.5px solid var(--grid);
    }
    .screens figcaption {
      margin-top: 14px;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--ink-faded);
    }
    /* The app's marker X (app/lib/ui/marker_x.dart, seed 6): two
       jittered cubic strokes, round felt-tip caps, the second pass a
       touch thinner. The X sits 22% inside its cell, hence the negative
       margins. */
    .x {
      width: 6.5rem;
      height: 6.5rem;
      display: block;
      margin: -1.2rem auto -1.4rem;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .x path { fill: none; stroke: var(--marker); stroke-linecap: round; }
    h1 {
      margin-top: 18px;
      font-size: 1.6rem;
      letter-spacing: 0.12em;
      font-weight: 800;
      text-transform: uppercase;
    }
    .tag { margin-top: 10px; color: var(--ink-faded); font-size: 1rem; line-height: 1.5; }
    .store {
      display: inline-block;
      margin-top: 28px;
      padding: 14px 26px;
      border-radius: 999px;
      background: var(--ink);
      color: var(--paper);
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      text-decoration: none;
      transition: background-color 0.15s;
    }
    .store:hover, .store:focus-visible { background: var(--marker); }
    .soon {
      margin-top: 18px;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--ink-faded);
    }
    footer { margin-top: 56px; font-size: 0.8rem; }
    footer a { color: var(--ink-faded); }
  </style>
</head>
<body>
  <main>
    <svg class="x" viewBox="0 0 100 100" aria-hidden="true">
      <path d="M17.3 17.7 C41.5 32.9 54.5 53.1 82.1 73.7" stroke-width="11.4"/>
      <path d="M81.1 27.3 C56.9 43.7 37.5 62.7 19.6 75.5" stroke-width="10.3"/>
    </svg>
    <h1>Exfield</h1>
    <p class="tag">Don't break the chain. A wall-calendar habit tracker —
      one red X per day, all data on your device.</p>
    <a class="store" href="https://apps.apple.com/app/exfield-habit-calendar/id6805454452">Download on the App Store</a>
    <p class="soon">Google Play coming soon</p>
  </main>
  <section class="screens" aria-label="Screenshots">
    <figure>
      <picture>
        <source srcset="img/home-dark.png" media="(prefers-color-scheme: dark)">
        <img src="img/home-light.png" width="603" height="1311" alt="The habits list: three habits, each with today's X circle, its chain length and this month's progress stroke.">
      </picture>
      <figcaption>One tap. One red X.</figcaption>
    </figure>
    <figure>
      <picture>
        <source srcset="img/calendar-dark.png" media="(prefers-color-scheme: dark)">
        <img src="img/calendar-light.png" width="603" height="1311" alt="A habit's wall calendar for August with a 16-day chain of red X-es, plus current chain, record chain and month and year progress.">
      </picture>
      <figcaption>Your chain, your record.</figcaption>
    </figure>
    <figure>
      <picture>
        <source srcset="img/year-dark.png" media="(prefers-color-scheme: dark)">
        <img src="img/year-light.png" width="603" height="1311" alt="The year at a glance: twelve mini months with every marked day X-ed.">
      </picture>
      <figcaption>The whole year at a glance.</figcaption>
    </figure>
  </section>
  <script>
    // Draws the X on stroke by stroke, the way the app does when a day
    // is marked: 450ms, ease-out, first stroke in the first half of the
    // progress, then the second. Tap to redraw.
    (function () {
      var svg = document.querySelector('.x');
      var strokes = Array.prototype.map.call(svg.querySelectorAll('path'), function (path) {
        var length = path.getTotalLength();
        path.style.strokeDasharray = length;
        return { path: path, length: length };
      });
      var DRAW_MS = 450, FIRST_STROKE_END = 0.5;
      function show(progress) {
        var first = Math.min(1, progress / FIRST_STROKE_END);
        var second = Math.max(0, (progress - FIRST_STROKE_END) / (1 - FIRST_STROKE_END));
        strokes[0].path.style.strokeDashoffset = strokes[0].length * (1 - first);
        strokes[1].path.style.strokeDashoffset = strokes[1].length * (1 - second);
      }
      function draw() {
        var start = null;
        function frame(now) {
          if (start === null) start = now;
          var t = Math.min(1, (now - start) / DRAW_MS);
          show(1 - Math.pow(1 - t, 3));
          if (t < 1) requestAnimationFrame(frame);
        }
        show(0);
        requestAnimationFrame(frame);
      }
      if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
        show(1);
      } else {
        draw();
        svg.addEventListener('click', draw);
      }
    })();
  </script>
  <footer><a href="/privacy">Privacy policy</a> · <a href="mailto:hello@exfield.app">hello@exfield.app</a></footer>
</body>
</html>
